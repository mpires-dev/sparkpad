services:
  sparkpad:
    build:
      context: .
      dockerfile: deploy/sync/Dockerfile
    container_name: sparkpad-sync
    restart: unless-stopped
    ports:
      - "7348:7348"
    env_file: .env
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "sparkpad-sync-server", "--healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
