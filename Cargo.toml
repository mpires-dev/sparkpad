[package]
name = "sparkpad"
version = "0.2.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[features]
default = ["gui"]
gui = ["dep:gpui", "dep:gpui-component", "dep:empire-ui", "dep:cocoa", "dep:objc", "dep:raw-window-handle", "dep:ropey", "dep:tree-sitter"]

[dependencies]
anyhow = "1"
markdown = "1"
html5ever = "0.27"
markup5ever_rcdom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
gpui = { version = "=0.2.2", optional = true }
gpui-component = { version = "=0.5.1", optional = true, features = ["tree-sitter-languages"] }
ropey = { version = "=2.0.0-beta.1", optional = true }
tree-sitter = { version = "0.25.4", optional = true }
empire-ui = { path = "vendor/empire-ui", optional = true }
cocoa = { version = "0.26", optional = true }
objc = { version = "0.2", optional = true }
raw-window-handle = { version = "0.6", optional = true }

[patch.crates-io]
gpui = { path = "vendor/gpui" }
gpui-component = { path = "vendor/gpui-component" }

[profile.dev.package."*"]
opt-level = 2

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[[test]]
name = "rich_text"
harness = false
required-features = ["gui"]
