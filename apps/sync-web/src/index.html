<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#161616"><meta name="referrer" content="no-referrer"><title>Sparkpad — Your notes</title><link rel="icon" href="./icon.png"><link rel="apple-touch-icon" href="./icon.png"><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./style.css"></head>
<body>
<section id="login" class="login"><form id="connect"><img src="./icon.png" alt="Sparkpad" width="72" height="72"><h1>A little room to think.</h1><p>Connect to your Sparkpad server. Notes are stored on this device and synchronized in the background.</p><label for="key">Server connection key</label><input id="key" type="password" autocomplete="current-password" required minlength="32"><button>Connect</button><p id="login-error" role="alert"></p></form></section>
<div id="workspace" hidden><header><button id="menu" aria-label="Toggle pages">☰</button><a class="brand" href="./"><img src="./icon.png" alt="" width="30" height="30">Sparkpad</a><span id="status" role="status">Connecting…</span><button id="disconnect">Disconnect</button></header><div class="layout"><aside id="sidebar"><div class="section"><strong>Your space</strong><button id="create" aria-label="Create a note">＋</button></div><nav id="notes" aria-label="Pages"></nav></aside><main id="document"><div id="empty"><h1>Make room for your next idea.</h1><p>Create a page or wait for your notes to sync.</p></div><section id="editor" hidden><div id="cover" hidden></div><div class="page"><div id="page-icon" aria-hidden="true">✳️</div><label class="sr-only" for="title">Page title</label><input id="title" autocomplete="off" placeholder="Untitled"><div class="toolbar"><button id="edit-tab" aria-pressed="true">Edit Markdown</button><button id="preview-tab" aria-pressed="false">Preview</button><button id="insert-image">Image</button><input id="image-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/svg+xml" hidden><button id="remove">Delete page</button></div><label class="sr-only" for="body">Page Markdown</label><textarea id="body" spellcheck="true" placeholder="Start with an idea…"></textarea><div id="preview" hidden></div><p class="hint">Saved on this device · Changes sync automatically</p></div></section></main></div></div><script type="module" src="./app.js"></script></body></html>
